title: 'COM Object Hijack: CLSID Server Key Pointing to User-Writable Path'
id: 18f84ad9-0059-5770-a610-1eba22b69013
name: com_hijack_clsid_user_path
status: experimental
description: Hunt 01 output. Detects registry writes that set a CLSID InprocServer32/LocalServer32 default value to a user-writable location (ProgramData, Users, Temp, AppData, Windows\Tasks), the persistence pattern of COM hijacking used by Turla-style Outlook backdoors and Firefox hijacks.
references:
- https://attack.mitre.org/techniques/T1546/015/
- 'https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES :: Persistence/persist_firefox_comhijack_sysmon_11_13_7_1.evtx'
- 'https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES :: Persistence/persist_turla_outlook_backdoor_comhijack.evtx'
author: Madhan (Cyberion Defense Labs - Detection Engineering)
date: '2026-11-03'
tags:
- attack.persistence
- attack.t1546.015
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 13
    TargetObject|contains: \CLSID\{
    TargetObject|re: \\(InprocServer32|LocalServer32)\\[\(\{]Default[\)\}]$
    Details|contains:
    - \ProgramData\
    - \Users\
    - \Temp\
    - \AppData\
    - \Windows\Tasks\
  condition: selection
falsepositives:
- Per-user installed COM components (e.g., some Office add-ins, Teams/OneDrive shell extensions) register under HKCU with AppData paths
level: high
