title: Windows Security Event Log Cleared
id: a7a4351b-a0df-50ad-a646-84839df08cd2
name: security_log_cleared
status: experimental
description: Detects clearing of the Windows Security audit log (Event ID 1102). Adversaries clear logs to remove evidence of intrusion activity.
references:
- https://attack.mitre.org/techniques/T1685/005/
- 'https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES :: Command and Control/DE_RDP_Tunnel_5156.evtx'
- 'https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES :: Credential Access/ACL_ForcePwd_SPNAdd_User_Computer_Accounts.evtx'
- 'https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES :: Credential Access/CA_chrome_firefox_opera_4663.evtx'
- 'https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES :: Credential Access/Zerologon_VoidSec_CVE-2020-1472_4626_LT3_Anonym_follwedby_4742_DC_Anony_DC.evtx'
author: Habebur Rahman, FRIEND_NAME_HERE (Cyberion Defense Labs - Detection Engineering)
date: '2026-11-03'
tags:
- attack.defense-impairment
- attack.t1685.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
- Authorised administrators clearing logs during maintenance or log-rotation
- Lab/golden-image preparation before telemetry capture (seen in 24 dataset samples)
level: high
